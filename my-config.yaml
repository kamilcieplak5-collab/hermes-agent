# Hermes Agent - Local Config
# Skopiuj do ~/.hermes/config.yaml i dostosuj
model:
  default: claude-sonnet-4-6
  provider: anthropic
  context_length: 1000000

terminal:
  backend: local
  cwd: .
  timeout: 180
  persistent_shell: true

web:
  backend: ''
  search_backend: ''
  extract_backend: ''

agent:
  max_turns: 120
  gateway_timeout: 1800
